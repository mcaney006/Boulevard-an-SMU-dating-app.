[package]
name = "boulevard-worker"
description = "Boulevard API on Cloudflare Workers: @smu.edu verification, profiles, the published deck, matches, chat (Durable Objects), reports."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
boulevard-core = { path = "../boulevard-core" }
worker = { version = "0.8.7", features = ["d1"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
