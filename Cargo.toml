[workspace]
resolver = "2"
members = ["crates/boulevard-core", "crates/boulevard-worker"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mcaney006/Boulevard-an-SMU-dating-app."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }

# Small, size-optimised wasm for the Worker; the core crate is tested natively.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
